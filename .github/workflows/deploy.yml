name: Deploy

# Rebuilds the site with fresh orbital elements several times a day. The
# catalog is fetched here and shipped inside the build; it is never committed,
# and visitors' browsers never talk to CelesTrak.
on:
  push:
    branches: [main]
  schedule:
    # Every six hours, off the top of the hour. CelesTrak refreshes about every
    # two hours and asks clients not to poll more often than that.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a deploy in progress finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # If CelesTrak is unreachable this step fails, the workflow stops, and the
      # previous deployment stays live with its slightly older data.
      - run: npm run data
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
