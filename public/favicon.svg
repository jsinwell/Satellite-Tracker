<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Satellite Tracker</title>
  <defs>
    <radialGradient id="sky" cx="0.5" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#14203d"/>
      <stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <!-- Lit from the upper left, falling off into night at the lower right. -->
    <radialGradient id="earth" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#8bdcff"/>
      <stop offset="0.4" stop-color="#2f7df0"/>
      <stop offset="1" stop-color="#0a1746"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <g fill="none" stroke-linecap="round" transform="rotate(-32 32 32)">
    <!-- The far half of the orbit, which the planet hides part of. -->
    <path d="M5 32A27 10.5 0 0 1 59 32" stroke="#5eead4" stroke-opacity="0.5" stroke-width="3"/>
  </g>
  <circle cx="32" cy="32" r="16.5" fill="url(#earth)"/>
  <g fill="none" stroke-linecap="round" transform="rotate(-32 32 32)">
    <!-- The near half, with a dark edge so it reads against the planet. -->
    <path d="M5 32A27 10.5 0 0 0 59 32" stroke="#05070d" stroke-width="7.5"/>
    <path d="M5 32A27 10.5 0 0 0 59 32" stroke="#5eead4" stroke-width="3.5"/>
    <circle cx="57" cy="28" r="6.5" fill="#05070d" stroke="none"/>
    <circle cx="57" cy="28" r="4.5" fill="#f8fafc" stroke="none"/>
  </g>
</svg>
